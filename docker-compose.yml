services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curriculo
      POSTGRES_USER: curriculo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculo"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
